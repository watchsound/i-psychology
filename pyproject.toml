[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychology-base"
version = "0.0.1"
description = "SOTA memory + psychology substrate for learning-companion and long-term-emotional-companion applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "nihan" }]
dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
    "rank_bm25>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"psychology_base" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
